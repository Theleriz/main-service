services:
  postgres:
    image: postgres:17
    container_name: lms-postgres
    environment:
      POSTGRES_DB: lms_main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_main"]
      interval: 5s
      timeout: 5s
      retries: 10

  main-service:
    # Pulled from Docker Hub; to build locally instead run: docker build -t theleriz/main-service:latest .
    image: theleriz/main-service:latest
    container_name: lms-main-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: lms_main
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  postgres-data:
