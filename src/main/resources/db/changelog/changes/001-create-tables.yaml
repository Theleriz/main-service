databaseChangeLog:
  - changeSet:
      id: 001-create-courses
      author: bitlab
      changes:
        - createTable:
            tableName: courses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: created_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-chapters
      author: bitlab
      changes:
        - createTable:
            tableName: chapters
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: order_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_chapters_course
                    references: courses(id)
                    deleteCascade: true
              - column:
                  name: created_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: chapters
            indexName: idx_chapters_course_id
            columns:
              - column:
                  name: course_id

  - changeSet:
      id: 001-create-lessons
      author: bitlab
      changes:
        - createTable:
            tableName: lessons
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: content
                  type: TEXT
              - column:
                  name: order_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: chapter_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_lessons_chapter
                    references: chapters(id)
                    deleteCascade: true
              - column:
                  name: created_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: lessons
            indexName: idx_lessons_chapter_id
            columns:
              - column:
                  name: chapter_id
